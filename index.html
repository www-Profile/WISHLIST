<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>WISHLIST</h1>
      <p>Список желаний на день рождения</p>
    </header>

    <div class="countdown">
      <span class="countdown-label">До праздника</span>
      <span id="countdown-text" class="countdown-value">—</span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="wanted">Желания</button>
      <button class="filter-btn" data-filter="reserved">Забронировано</button>
    </div>

    <!-- Сюда скрипт будет вставлять карточки -->
    <div class="wish-list" id="wish-list"></div>
    <div class="empty" id="empty-state" style="display:none">
      <div class="empty-icon">🎁</div>
      <div class="empty-text">Здесь пока ничего нет</div>
    </div>
  </div>

  <!-- МОДАЛКА -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-image" id="modal-image"></div>
        <div class="modal-price" id="modal-price"></div>
      </div>
      <div class="modal-footer">
        <a class="modal-link" id="modal-link" href="#" target="_blank" rel="noopener">Открыть ссылку</a>
        <button class="modal-action" id="modal-action">Забронировать</button>
      </div>
    </div>
  </div>

  <!-- Никакой библиотеки supabase-js, только наш скрипт -->
  <script src="script.js"></script>
</body>
</html>
